<!doctype html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesion — Dreamlike Electricidad</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>

<header class="dl-header">
  <div class="dl-header__in" style="justify-content:center">
    <a class="dl-logo" href="index.html" aria-label="Dreamlike Electricidad — inicio">
      <img src="assets/img/logo-oscuro.svg" alt="Dreamlike Electricidad">
    </a>
  </div>
</header>

<main class="dl-auth">
  <div class="dl-auth__card">
    <a class="dl-auth__volver" href="index.html">
      <svg class="dl-ico" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      Volver a la tienda
    </a>

    <h1>Iniciar sesion</h1>
    <p class="dl-auth__sub">Accede a tus pedidos, cotizaciones y direcciones guardadas.</p>

    <p class="dl-auth__aviso">
      Prototipo: cualquier email y contrasena inician sesion. No hay validacion real.
    </p>

    <form id="formLogin" novalidate>
      <div class="dl-campo">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.cl" required>
      </div>
      <div class="dl-campo">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="1">
      </div>
      <p class="dl-auth__error" id="errorLogin">Ingresa tu correo para continuar.</p>
      <button type="submit" class="dl-btn dl-btn--primario dl-btn--bloque">Iniciar sesion</button>
    </form>

    <p class="dl-auth__pie">
      ¿No tienes cuenta? Escribenos a
      <a href="mailto:ventasweb@dreamlike.cl">ventasweb@dreamlike.cl</a> para crear tu perfil B2B.
    </p>
  </div>
</main>

<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>
<script src="assets/js/whatsapp-flotante.js"></script>
</body>
</html>
